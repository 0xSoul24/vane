name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [ 'admin', 'bedtime', 'core', 'enchantments', 'permissions', 'portals', 'regions', 'trifles', 'velocity', 'geyser-extension' ]

    steps:
      - uses: actions/checkout@v7

      # The Gradle toolchain requires JDK 25; the previous "set up JDK 21" step was
      # immediately overridden by this one and only cost time.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'corretto'

      # Caches ~/.gradle/caches and the Gradle daemon state across runs. Without this every
      # matrix job re-downloaded the Paper dev bundle and recompiled vane-core from scratch.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Gradle build
        run: |
          cd vane-${{ matrix.project }}
          ../gradlew build
          # Get the Git hash
          git_hash=$(git rev-parse --short "$GITHUB_SHA")
          echo "git_hash=$git_hash" >> $GITHUB_ENV

      - name: Upload JAR
        if: ${{ github.event_name != 'pull_request'}}
        uses: actions/upload-artifact@v7
        with:
          name: vane-${{ matrix.project }}-${{ env.git_hash }}.jar
          path: target/vane-${{ matrix.project }}-*.jar
          archive: false
