org.gradle.console=rich

# Build performance.
# The project is 100% Kotlin with 12 mostly-independent modules, so parallel
# execution and the local build cache pay off on every incremental build.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC

# Enable Dokka Gradle Plugin V2 API
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers
