[versions]
paper = "26.2.build.+"
velocity = "4.1.1"
bstats = "3.2.1"
dokka = "2.2.0"
geyser = "2.11.2-SNAPSHOT"

[libraries]
annotations = { group = "org.jetbrains", name = "annotations", version = "26.1.0" }
json = { group = "org.json", name = "json", version = "20260814" }
slf4j = { group = "org.slf4j", name = "slf4j-api", version = "2.0.19" }

# Pins for vulnerable transitive dependencies dragged in by paper-api's
# maven-resolver-provider chain; see the constraints in the root build script.
commonsLang3 = { group = "org.apache.commons", name = "commons-lang3", version = "3.20.0" }
plexusUtils = { group = "org.codehaus.plexus", name = "plexus-utils", version = "4.1.0" }

nightConfig = { group = "com.electronwill.night-config", name = "toml", version = "3.9.0" }

# Geyser
geyserApi = { group = "org.geysermc.geyser", name = "api", version.ref = "geyser" }

# Minecraft
bstatsBase = { group = "org.bstats", name = "bstats-base", version.ref = "bstats" }
bstatsBukkit = { group = "org.bstats", name = "bstats-bukkit", version.ref = "bstats" }
bstatsVelocity = { group = "org.bstats", name = "bstats-velocity", version.ref = "bstats" }
paperApi = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
serviceIo = { group = "net.thenextlvl", name = "service-io", version = "2.6.0" }
velocity = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }
packetEvents = { group = "com.github.retrooper", name = "packetevents-spigot", version = "2.13.0" }

# spotbugs / findbugs annotations (avoids missing annotation warnings)
spotbugsAnnotations = { group = "com.github.spotbugs", name = "spotbugs-annotations", version = "4.10.4" }

# maps
dynmap = { group = "us.dynmap", name = "DynmapCoreAPI", version = "3.8" }
bluemap = { group = "de.bluecolored", name = "bluemap-api", version = "2.8.0" }

[plugins]
paperweightUserdev = { id = "io.papermc.paperweight.userdev", version = "2.0.0-beta.+" }
runPaper = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
